name: Release

# A tag v<version> builds the desktop app for macOS, Linux and Windows, starts each packaged build once, and publishes
# them as a GitHub release. Run by hand, it builds and tests the same packages and keeps them as workflow artifacts.
#
# macOS apps are signed with a Developer ID and notarized when these repository secrets exist (Settings → Secrets and
# variables → Actions); without them the macOS builds are left unsigned and everything else is unchanged:
#   APPLE_CERTIFICATE           the Developer ID Application certificate with its private key, as a base64 .p12
#   APPLE_CERTIFICATE_PASSWORD  the password that .p12 was exported with
#   APPLE_ID                    the Apple ID that belongs to the developer account
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID (appleid.apple.com)
#   APPLE_TEAM_ID               the 10-character team identifier
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-arm64, os: macos-latest, arch: arm64, folder: darwin, app: "Rna Agent.app" }
          - { name: macOS-x64, os: macos-15-intel, arch: x64, folder: darwin, app: "Rna Agent.app" }
          - { name: Linux-x64, os: ubuntu-latest, arch: x64, folder: linux, app: "" }
          - { name: Windows-x64, os: windows-latest, arch: x64, folder: win32, app: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototypes/control-center/package-lock.json
            prototypes/control-center/web/package-lock.json
            prototypes/control-center/desktop/package-lock.json
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./prototypes/control-center/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1; fi
      - name: Display server for the Linux app test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 || sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2
      - name: Install
        run: |
          npm ci --prefix prototypes/control-center
          npm ci --prefix prototypes/control-center/web
          npm ci --prefix prototypes/control-center/desktop
      - name: Package
        working-directory: prototypes/control-center/desktop
        run: npm run package -- --out dist/release --arch ${{ matrix.arch }}
      - name: Is macOS signing configured?
        id: signing
        if: runner.os == 'macOS'
        env:
          CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "enabled=$CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" != "true" ]; then echo "::notice::No Apple signing secrets: the macOS build stays unsigned."; fi
      - name: Sign and notarize the macOS app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: prototypes/control-center/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A keychain of its own, with a throwaway password, removed at the end of the job.
          keychain="$RUNNER_TEMP/rna-signing.keychain-db"; keychain_password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -oE '[0-9A-F]{40}' | head -1)
          if [ -z "$identity" ]; then echo "::error::The certificate has no valid code-signing identity (is it a Developer ID Application certificate, with its private key?)"; exit 1; fi
          xcrun notarytool store-credentials rna-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain" > /dev/null
          dmg=$(ls dist/release/Rna-Agent-*.dmg)
          node sign-macos.mjs "$dmg" --identity "$identity" --notary-profile rna-notary --keychain "$keychain" --out dist/signed
          # What was just checked and notarized replaces the unsigned app and image; the steps below handle them as before.
          rm -f dist/release/Rna-Agent-*.dmg && cp dist/signed/Rna-Agent-*.dmg dist/release/
          app="dist/release/Rna Agent-${{ matrix.folder }}-${{ matrix.arch }}/${{ matrix.app }}"
          rm -rf "$app" && ditto "dist/signed/Rna Agent.app" "$app"
      - name: Start the packaged build once
        working-directory: prototypes/control-center/desktop
        run: |
          app="dist/release/Rna Agent-${{ matrix.folder }}-${{ matrix.arch }}"
          if [ -n "${{ matrix.app }}" ]; then app="$app/${{ matrix.app }}"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node check-packaged-build.mjs "$app" --app; else node check-packaged-build.mjs "$app" --app; fi
      - name: Collect
        working-directory: prototypes/control-center/desktop/dist/release
        run: |
          mkdir -p ../upload
          cp Rna-Agent-* ../upload/
          cp build-report.json "../upload/build-report-${{ matrix.name }}.json"
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: rna-agent-${{ matrix.name }}
          path: prototypes/control-center/desktop/dist/upload/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          rm -f build-report-*.json
          sha256sum Rna-Agent-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/{{version}}/$version/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "Rna Agent $version" --notes-file notes.md --generate-notes --verify-tag
