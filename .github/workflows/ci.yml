name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototypes/control-center/package-lock.json
            prototypes/control-center/web/package-lock.json
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "Rna CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Install
        run: |
          npm ci --prefix prototypes/control-center
          npm ci --prefix prototypes/control-center/web
      - name: SDK tests
        working-directory: packages/sdk
        run: node --test test/*.test.mjs
      - name: Web typecheck, tests and build
        working-directory: prototypes/control-center/web
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Host tests
        working-directory: prototypes/control-center
        run: node --test
      - name: Desktop shell tests
        working-directory: prototypes/control-center/desktop
        run: node --test test/*.test.cjs

  portable:
    name: Web and SDK (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/control-center/web/package-lock.json
      - name: Install
        run: npm ci --prefix prototypes/control-center/web
      - name: Web typecheck, tests and build
        working-directory: prototypes/control-center/web
        run: |
          npm run typecheck
          npm test
          npm run build
      # The SDK is developed on macOS; this run shows where Linux differs without holding a change back.
      - name: SDK tests (informational)
        working-directory: packages/sdk
        continue-on-error: true
        run: node --test test/*.test.mjs
